[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-buddy-rag"
version = "0.1.0"
description = "Access-aware retrieval for intern onboarding"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
local = ["sentence-transformers>=5.1,<6"]
pdf = ["pypdf==6.21.4", "pypdfium2==5.13.0", "Pillow==13.0.0"]
server = ["fastapi==0.163.0", "pydantic==2.14.3", "uvicorn==0.54.0", "grpcio==1.85.1", "grpcio-health-checking==1.85.1", "protobuf==7.36.2"]
dev = ["grpcio-tools==1.85.1", "httpx==0.28.1"]

[tool.setuptools]
packages = ["rag", "rag.ingestion", "rag.knowledge", "rag.transport", "rag.v1"]
package-dir = {"" = "src", "rag.knowledge" = "knowledge"}

[tool.setuptools.package-data]
"rag.knowledge" = ["*.json", "*.md"]
