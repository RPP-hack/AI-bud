[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-buddy-rag"
version = "0.1.0"
description = "Access-aware retrieval for intern onboarding"
requires-python = ">=3.11"

[project.optional-dependencies]
pdf = ["pypdf==6.21.4", "pypdfium2==5.13.0", "Pillow==13.0.0"]

[tool.setuptools]
packages = ["rag", "rag.ingestion", "rag.knowledge"]
package-dir = {"" = "src", "rag.knowledge" = "knowledge"}

[tool.setuptools.package-data]
"rag.knowledge" = ["*.json", "*.md"]
