services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: buddy-local
      POSTGRES_DB: buddy
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - buddy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddy -d buddy"]
      interval: 2s
      timeout: 3s
      retries: 20
  mock-access:
    build: services/api
    entrypoint: ["mock-access"]
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: postgres://buddy:buddy-local@db:5432/buddy?sslmode=disable
      MOCK_TOKEN: local-mock-token
      MOCK_ADDR: ":8090"
      MOCK_GRANT_AFTER: "30s"
    depends_on:
      db:
        condition: service_healthy
  api:
    build: services/api
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: postgres://buddy:buddy-local@db:5432/buddy?sslmode=disable
      HTTP_ADDR: ":8080"
      MOCK_URL: http://mock-access:8090
      MOCK_TOKEN: local-mock-token
      RECONCILE_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mock-access:
        condition: service_started
volumes:
  buddy-db:
