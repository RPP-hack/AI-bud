services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: buddy-local
      POSTGRES_DB: buddy
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - buddy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddy -d buddy"]
      interval: 2s
      timeout: 3s
      retries: 20
  mock-access:
    build: services/api
    entrypoint: ["mock-access"]
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: postgres://buddy:buddy-local@db:5432/buddy?sslmode=disable
      MOCK_TOKEN: local-mock-token
      MOCK_ADDR: ":8090"
      MOCK_GRANT_AFTER: "30s"
    depends_on:
      db:
        condition: service_healthy
  api:
    build: services/api
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: postgres://buddy:buddy-local@db:5432/buddy?sslmode=disable
      HTTP_ADDR: ":8080"
      MOCK_URL: http://mock-access:8090
      MOCK_TOKEN: local-mock-token
      RECONCILE_ENABLED: "true"
      RAG_GRPC_TARGET: rag:50051
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-local-rag-token}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mock-access:
        condition: service_started
      rag:
        condition: service_healthy
  rag-index:
    build:
      context: ../rag
      target: server
    entrypoint: ["python", "-m", "rag"]
    command: ["index"]
    volumes:
      - rag-data:/data
  rag:
    build:
      context: ../rag
      target: server
    environment:
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-local-rag-token}
      RAG_HTTP_HOST: 0.0.0.0
      RAG_GRPC_ADDR: 0.0.0.0:50051
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-openai/gpt-4o-mini}
    ports:
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:50051:50051"
    volumes:
      - rag-data:/data:ro
    depends_on:
      rag-index:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/readyz', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  buddy-db:
  rag-data:
