x-rag-storage: &rag-storage
  RAG_DATABASE_URL: postgresql://buddy:buddy-local@db:5432/buddy
  RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-local}
  RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-${RAG_LLM_API_KEY:-}}
  RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-https://openrouter.ai/api/v1}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-BAAI/bge-m3}
  RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1024}
  RAG_EMBEDDING_DEVICE: ${RAG_EMBEDDING_DEVICE:-cpu}
  RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-4}
  RAG_EMBEDDING_REVISION: ${RAG_EMBEDDING_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
  HF_HOME: /models
  RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.3}

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: buddy-local
      POSTGRES_DB: buddy
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - buddy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddy -d buddy"]
      interval: 2s
      timeout: 3s
      retries: 20
  mock-access:
    build: services/api
    entrypoint: ["mock-access"]
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: postgres://buddy:buddy-local@db:5432/buddy?sslmode=disable
      MOCK_TOKEN: local-mock-token
      MOCK_ADDR: ":8090"
      MOCK_GRANT_AFTER: "30s"
    depends_on:
      db:
        condition: service_healthy
  api:
    build: services/api
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: postgres://buddy:buddy-local@db:5432/buddy?sslmode=disable
      HTTP_ADDR: ":8080"
      MOCK_URL: http://mock-access:8090
      MOCK_TOKEN: local-mock-token
      RECONCILE_ENABLED: "true"
      RAG_GRPC_TARGET: rag:50051
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-local-rag-token}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mock-access:
        condition: service_started
      rag:
        condition: service_healthy
  rag-index:
    build:
      context: ../rag
      target: server
    entrypoint: ["python", "-m", "rag"]
    command: ["index"]
    environment: *rag-storage
    volumes:
      - rag-models:/models
    depends_on:
      db:
        condition: service_healthy
  rag:
    build:
      context: ../rag
      target: server
    environment:
      <<: *rag-storage
      HF_HUB_OFFLINE: "1"
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-local-rag-token}
      RAG_HTTP_HOST: 0.0.0.0
      RAG_GRPC_ADDR: 0.0.0.0:50051
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-openai/gpt-4o-mini}
    ports:
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:50051:50051"
    volumes:
      - rag-models:/models
    depends_on:
      db:
        condition: service_healthy
      rag-index:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/ready', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 120s
volumes:
  buddy-db:
  rag-models:
