name: rpp-buddy
services:
  rpp-buddy-gateway:
    image: caddy:latest
    container_name: rpp-buddy-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway:/etc/caddy
      - ./frontend:/var/www/html
  rag:
    profiles: ["rag"]
    build:
      context: ./rag
      target: demo
    environment:
      RAG_LLM_API_KEY: "${RAG_LLM_API_KEY:-}"
      RAG_LLM_BASE_URL: "${RAG_LLM_BASE_URL:-https://openrouter.ai/api/v1}"
      RAG_LLM_MODEL: "${RAG_LLM_MODEL:-openai/gpt-4o-mini}"
    volumes:
      - rag-data:/data

volumes:
  rag-data:
