name: Frontend quality
on:
  pull_request:
    paths:
      [
        "frontend/**",
        "gateway/**",
        "docker-compose.dev.yaml",
        ".github/workflows/frontend-quality.yml",
      ]
  push:
    paths:
      [
        "frontend/**",
        "gateway/**",
        "docker-compose.dev.yaml",
        ".github/workflows/frontend-quality.yml",
      ]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run coverage
      - name: Validate Compose
        run: docker compose -f docker-compose.dev.yaml config --quiet
        working-directory: .
      - name: Validate existing gateway
        run: docker run --rm -v "$PWD/gateway/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
        working-directory: .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
