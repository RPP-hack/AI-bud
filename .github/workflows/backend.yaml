name: Backend
on:
  push:
    paths: [ '../../backend/services/api/**', '.github/workflows/backend.yaml', '../../backend/compose.yaml', '../../backend/Makefile' ]
  pull_request:
    paths: [ '../../backend/services/api/**', '.github/workflows/backend.yaml', '../../backend/compose.yaml', '../../backend/Makefile' ]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: buddy
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: buddy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U buddy -d buddy"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://buddy:test-password@localhost:5432/buddy?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet -tags=integration ./...
      - run: go test -race -count=1 -tags=integration -coverpkg=./... -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out
      - name: Require 85 percent statement coverage
        run: >-
          go tool cover -func=coverage.out |
          awk '/^total:/ {found=1; sub(/%/, "", $3); if ($3 < 85) exit 1} END {if (!found) exit 1}'
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: services/api/coverage.out
