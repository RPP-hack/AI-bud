name: Release quality
on:
  pull_request:
  push:
    branches: [main, backend-branch]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: buddy
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: buddy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U buddy -d buddy"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://buddy:test-password@localhost:5432/buddy?sslmode=disable
      RAG_TEST_DATABASE_URL: postgres://buddy:test-password@localhost:5432/buddy?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/services/api/go.mod
          cache-dependency-path: backend/services/api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e './rag[server,dev,pdf]' coverage==7.17.3
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: python scripts/check_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-quality
          path: |
            docs/coverage/
            frontend/coverage/
            backend/services/api/coverage.out
